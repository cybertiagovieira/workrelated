ne-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g><g class="edgeLabel"><g class="label" data-id="L_D_O_0" transform="translate(0, 0)"><foreignObject width="0" height="0"><div xmlns="http://www.w3.org/1999/xhtml" class="labelBkg" style="display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;"><span class="edgeLabel"></span></div></foreignObject></g></g></g><g class="nodes"><g class="node default s" id="my-svg-flowchart-A-0" data-look="classic" transform="translate(132, 166.25)"><rect class="basic label-container" style="fill:#F3F8F6 !important;stroke:#0B7A5A !important;stroke-width:2px !important" x="-124" y="-147" width="248" height="294"/><g class="label" style="color:#1F2933 !important" transform="translate(-100, -135)"><rect/><foreignObject width="200" height="270"><div style="color: rgb(31, 41, 51) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1F2933 !important" class="nodeLabel"><p><b>1. SCAN THE MONTH</b><br />─────<br />• Market vital signs: BTC, ETH, stablecoins<br />• Exchange, custody and protocol incidents<br />• Illicit finance and state-linked activity<br />• Institutional adoption and tokenisation<br />• Regulatory mandates and deadlines</p></span></div></foreignObject></g></g><g class="node default s" id="my-svg-flowchart-B-1" data-look="classic" transform="translate(425, 166.25)"><rect class="basic label-container" style="fill:#F3F8F6 !important;stroke:#0B7A5A !important;stroke-width:2px !important" x="-124" y="-102" width="248" height="204"/><g class="label" style="color:#1F2933 !important" transform="translate(-100, -90)"><rect/><foreignObject width="200" height="180"><div style="color: rgb(31, 41, 51) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1F2933 !important" class="nodeLabel"><p><b>2. FILTER FOR MATERIALITY</b><br />─────<br />• Confirmed by primary sources<br />• Clear path to custody, AML,<br />• liquidity or conduct exposure<br />• Noise and claims excluded</p></span></div></foreignObject></g></g><g class="node default s" id="my-svg-flowchart-C-2" data-look="classic" transform="translate(718, 166.25)"><rect class="basic label-container" style="fill:#F3F8F6 !important;stroke:#0B7A5A !important;stroke-width:2px !important" x="-124" y="-158.25" width="248" height="316.5"/><g class="label" style="color:#1F2933 !important" transform="translate(-100, -146.25)"><rect/><foreignObject width="200" height="292.5"><div style="color: rgb(31, 41, 51) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1F2933 !important" class="nodeLabel"><p><b>3. TRANSLATE INTO BUSINESS RISK</b><br />─────<br />Operational vulnerability<br />▼<br />Market and counterparty concentration<br />▼<br />Geopolitical and macro-financial threat<br />▼<br />Financial and regulatory impact</p></span></div></foreignObject></g></g><g class="node default s" id="my-svg-flowchart-D-3" data-look="classic" transform="translate(1011, 166.25)"><rect class="basic label-container" style="fill:#F3F8F6 !important;stroke:#0B7A5A !important;stroke-width:2px !important" x="-124" y="-102" width="248" height="204"/><g class="label" style="color:#1F2933 !important" transform="translate(-100, -90)"><rect/><foreignObject width="200" height="180"><div style="color: rgb(31, 41, 51) !important; display: table; white-space: break-spaces; line-height: 1.5; max-width: 200px; text-align: center; width: 200px;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#1F2933 !important" class="nodeLabel"><p><b>4. 2LoD JUDGEMENT</b><br />─────<br />• Outlook: Market, Trends, Regulation<br />• Challenge to 1LoD on custody,<br />sanctions, stablecoin reserves</p></span></div></foreignObject></g></g><g class="node default out" id="my-svg-flowchart-O-4" data-look="classic" transform="translate(1276.5078125, 166.25)"><rect class="basic label-container" style="fill:#0B7A5A !important;stroke:#0B7A5A !important" x="-96.5078125" y="-79.5" width="193.015625" height="159"/><g class="label" style="color:#FFFFFF !important" transform="translate(-72.5078125, -67.5)"><rect/><foreignObject width="145.015625" height="135"><div style="color: rgb(255, 255, 255) !important; display: table-cell; white-space: nowrap; line-height: 1.5; max-width: 200px; text-align: center;" xmlns="http://www.w3.org/1999/xhtml"><span style="color:#FFFFFF !important" class="nodeLabel"><p><b>Digital Assets and<br />Crypto Risk Outlook</b><br />─────<br />One slide for<br />Group CRO and<br />Risk Committee</p></span></div></foreignObject></g></g></g></g></g><defs><filter id="my-svg-drop-shadow" height="130%" width="130%"><feDropShadow dx="4" dy="4" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><defs><filter id="my-svg-drop-shadow-small" height="150%" width="150%"><feDropShadow dx="2" dy="2" stdDeviation="0" flood-opacity="0.06" flood-color="#000000"/></filter></defs><linearGradient id="my-svg-gradient" gradientUnits="objectBoundingBox" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#0B7A5A" stop-opacity="1"/><stop offset="100%" stop-color="hsl(-120, 0%, 90%)" stop-opacity="1"/></linearGradient></svg>